<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241153">
<title>Premier League Predictions</title>
<style>
:root{--bg:#f6f6fb;--card:#fff;--ink:#17152c;--muted:#716f82;--line:#e8e7ef;--purple:#241153;--purple2:#432092;--green:#08a77c;--greenbg:#dff9f1;--red:#b52c3c;--redbg:#fde9ec;--gold:#7b5a00;--goldbg:#fff3c9;--shadow:0 10px 28px rgba(25,18,65,.08);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:92px}
header{background:linear-gradient(135deg,var(--purple),#151044 72%,#2b176f);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 24px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(23,16,71,.18)}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;opacity:.7}h1{font-size:24px;line-height:1.05;margin:7px 0 5px}.sub{font-size:12px;opacity:.78}.identity{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:13px;padding:9px 10px;min-width:120px;text-align:right}.identity small{display:block;opacity:.65;font-size:9px;text-transform:uppercase;font-weight:800}.identity b{font-size:12px}
main{padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;margin-bottom:13px}.section{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:3px 0 11px}.section h2{font-size:18px;margin:0}.section span{font-size:11px;color:var(--muted)}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--purple2);color:#fff;font-weight:900}.btn.small{padding:8px 10px;font-size:11px}.btn.secondary{background:#efeff6;color:#343047}.btn.good{background:var(--green)}.btn.danger{background:var(--redbg);color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}
.field{margin:11px 0}.field label{display:block;font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #d9d8e5;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}.row{display:flex;gap:8px}.row>input{flex:1}.notice{font-size:12px;line-height:1.5;color:var(--muted)}.banner{border-radius:16px;padding:13px 15px;margin-bottom:14px;background:#fff7d9;border:1px solid #f1d98d;display:flex;gap:10px}.banner.good{background:#e8fff8;border-color:#b8eedc}
.fixture{border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px;margin-bottom:10px}.ftop{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.date{font-size:10px;color:var(--muted);font-weight:800}.pill{font-size:9px;font-weight:950;padding:5px 8px;border-radius:999px;white-space:nowrap}.pill.open{background:var(--greenbg);color:#08775c}.pill.locked{background:var(--redbg);color:var(--red)}.pill.soon{background:var(--goldbg);color:var(--gold)}.pill.done{background:#efeff5;color:#49465a}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.team{font-size:12px;font-weight:900}.team.away{text-align:right}.score{display:flex;align-items:center;gap:5px}.score input{width:42px;height:40px;text-align:center;border:1px solid #d9d8e5;border-radius:9px;font-size:16px;font-weight:950;background:#fafafe}.score b{font-size:17px}.dash{color:var(--muted);font-weight:900}.factions{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px}.saved{font-size:10px;color:#078365;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f5f4fa;border-radius:13px;text-align:center;padding:10px 6px}.stat b{display:block;font-size:21px}.stat span{font-size:9px;color:var(--muted);font-weight:800}table{width:100%;border-collapse:collapse}th{font-size:9px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}td{padding:10px 5px;border-bottom:1px solid var(--line);font-size:12px}tr:last-child td{border-bottom:0}.num{text-align:right}.tiny{font-size:9px;color:var(--muted);margin-top:2px}.person{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.person:last-child{border-bottom:0}.invite{background:#f7f5ff;border:1px dashed #b8addf;border-radius:14px;padding:13px;margin-top:10px}.code{font-size:24px;font-weight:950;letter-spacing:.12em;color:var(--purple2)}.sep{height:1px;background:var(--line);margin:13px 0}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:transparent;color:#777487;padding:6px 2px;font-size:9px;font-weight:850;display:flex;flex-direction:column;align-items:center;gap:3px}.nav button i{font-style:normal;font-size:18px}.nav button.active{color:var(--purple2)}.auth{max-width:520px;margin:24px auto}.logo{font-size:34px}.loading{text-align:center;padding:50px 20px;color:var(--muted)}.error{background:var(--redbg);color:var(--red);border-radius:12px;padding:11px;font-size:12px;font-weight:800;margin:10px 0}.success{background:var(--greenbg);color:#08775c;border-radius:12px;padding:11px;font-size:12px;font-weight:800;margin:10px 0}
@media(max-width:520px){h1{font-size:21px}main{padding:12px}.identity{min-width:108px}.score input{width:38px}}
</style>
</head>
<body>
<div class="app">
<header id="hdr" style="display:none"><div class="head"><div><div class="eyebrow">2026/27</div><h1>Premier League<br>Predictions</h1><div class="sub">3 exact · 1 correct outcome · 0 wrong</div></div><div class="identity"><small>Signed in as</small><b id="who"></b></div></div></header>
<main id="main"><div class="loading">Loading…</div></main>
<nav id="nav" class="nav" style="display:none"><button data-v="home" class="active"><i>⌂</i>Home</button><button data-v="predict"><i>✍️</i>Predict</button><button data-v="table"><i>🏆</i>Table</button><button data-v="history"><i>📊</i>History</button><button data-v="more"><i>☰</i>More</button></nav>
</div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://jzrbaeyvwagrwukntjbk.supabase.co','sb_publishable_OVczf1AxPQfYdwynkVlwaQ_9fdB9ij8');
const main=document.getElementById('main'),hdr=document.getElementById('hdr'),nav=document.getElementById('nav');
const UK='Europe/London',PENDING='plp_join';
let session=null,membership=null,league=null,fixtures=[],predictions=[],results=[],members=[],profiles={},standings=[],submission=[],invites=[],view='home';
const q=new URLSearchParams(location.search);if(q.get('join'))localStorage.setItem(PENDING,q.get('join').toUpperCase());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=i=>new Intl.DateTimeFormat('en-GB',{timeZone:UK,weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(i));
const prof=u=>profiles[u]||{},team=u=>prof(u).team_name||prof(u).display_name||'Player',badge=u=>prof(u).badge||'⚽';
const resultFor=f=>results.find(x=>x.fixture_id===f),predFor=(u,f)=>predictions.find(x=>x.user_id===u&&x.fixture_id===f);
const points=(p,r)=>!p||!r?0:(+p.home_score===+r.home_score&&+p.away_score===+r.away_score?3:(Math.sign(p.home_score-p.away_score)===Math.sign(r.home_score-r.away_score)?1:0));
const state=f=>resultFor(f.id)?'done':Date.now()>=new Date(f.prediction_lock_at)?'locked':Date.now()>=new Date(f.prediction_open_at)?'open':'soon';
const isAdmin=()=>membership?.role==='admin';

async function init(){const {data:{session:s}}=await supabase.auth.getSession();session=s;supabase.auth.onAuthStateChange((_e,s2)=>{session=s2;setTimeout(route,0)});route()}
async function route(){
 if(!session)return auth();
 const uid=session.user.id;const {data:mm}=await supabase.from('league_members').select('*').eq('user_id',uid);membership=(mm||[]).find(x=>x.status==='active')||null;
 if(!membership)return onboard();
 await load();hdr.style.display='block';nav.style.display='grid';document.getElementById('who').textContent=`${badge(uid)} ${prof(uid).display_name||session.user.email}`;render();
}
async function auth(){
 hdr.style.display='none';nav.style.display='none';const code=(localStorage.getItem(PENDING)||'').trim();let info=null;if(code){const {data}=await supabase.rpc('preview_invite',{p_code:code});info=data?.[0]}
 main.innerHTML=`<div class="auth"><div class="card"><div class="logo">⚽</div><h2>Premier League Predictions</h2><p class="notice">${info?`You've been invited to <b>${esc(info.league_name)}</b>.`:'Sign in to continue.'}</p>${info?`<div class="invite"><div class="tiny">JOIN CODE</div><div class="code">${esc(code)}</div><div class="notice">Joining closes ${fmt(info.join_deadline)}.</div></div>`:''}<div id="msg"></div><div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@example.com"></div><button class="btn good" id="send" style="width:100%">Email me a sign-in link</button><p class="notice">No password needed. Tap the sign-in link in the email.</p>${!code?`<div class="sep"></div><div class="field"><label>Have a join code?</label><div class="row"><input id="joinCode"><button class="btn secondary" id="use">Use</button></div></div>`:''}</div></div>`;
 document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email)return;const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});document.getElementById('msg').innerHTML=error?`<div class="error">${esc(error.message)}</div>`:`<div class="success">Email sent — check your inbox.</div>`};
 if(document.getElementById('use'))document.getElementById('use').onclick=async()=>{const c=document.getElementById('joinCode').value.trim().toUpperCase();const {data}=await supabase.rpc('preview_invite',{p_code:c});if(data?.[0]?.is_valid){localStorage.setItem(PENDING,c);auth()}else alert('Invalid or expired code.')};
}
async function onboard(){
 hdr.style.display='none';nav.style.display='none';const code=(localStorage.getItem(PENDING)||'').trim();
 if(!code){main.innerHTML=`<div class="auth"><div class="card"><h2>You're signed in</h2><p class="notice">Enter a league invite code.</p><div class="field"><label>Join code</label><input id="jc"></div><button class="btn" id="go">Continue</button><div class="sep"></div><button class="btn secondary" id="lo">Log out</button></div></div>`;document.getElementById('go').onclick=async()=>{const c=document.getElementById('jc').value.trim().toUpperCase();const {data}=await supabase.rpc('preview_invite',{p_code:c});if(data?.[0]?.is_valid){localStorage.setItem(PENDING,c);onboard()}else alert('Invalid or expired code.')};document.getElementById('lo').onclick=()=>supabase.auth.signOut();return}
 const {data}=await supabase.rpc('preview_invite',{p_code:code});const info=data?.[0];if(!info?.is_valid){main.innerHTML=`<div class="auth"><div class="card"><h2>Invite unavailable</h2><p class="notice">It has been used, revoked, expired, or the joining deadline has passed.</p><button class="btn secondary" id="clear">Use another code</button></div></div>`;document.getElementById('clear').onclick=()=>{localStorage.removeItem(PENDING);onboard()};return}
 main.innerHTML=`<div class="auth"><div class="card"><h2>Join ${esc(info.league_name)}</h2><div class="field"><label>Your name</label><input id="n"></div><div class="field"><label>Team name</label><input id="t" placeholder="e.g. Zach United"></div><div class="field"><label>Badge</label><select id="b">${['⚽','🦁','🔥','⚡','👑','🐺','🦅','🎯','🏆'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Favourite club (optional)</label><input id="c"></div><button class="btn good" id="join" style="width:100%">Join league</button><p class="notice">Joining closes ${fmt(info.join_deadline)}.</p></div></div>`;
 document.getElementById('join').onclick=async()=>{const {error}=await supabase.rpc('accept_league_invite',{p_code:code,p_display_name:document.getElementById('n').value.trim(),p_team_name:document.getElementById('t').value.trim(),p_badge:document.getElementById('b').value,p_favourite_club:document.getElementById('c').value.trim()||null});if(error)return alert(error.message);localStorage.removeItem(PENDING);route()};
}
async function load(){
 const lid=membership.league_id;const [L,F,P,R,M,S,SS,I]=await Promise.all([supabase.from('leagues').select('*').eq('id',lid).single(),supabase.from('fixtures').select('*').eq('league_id',lid).order('kickoff_at'),supabase.from('predictions').select('*'),supabase.from('results').select('*'),supabase.from('league_members').select('*').eq('league_id',lid),supabase.from('league_standings').select('*').eq('league_id',lid),supabase.rpc('get_submission_status',{p_league_id:lid}),supabase.from('invites').select('*').eq('league_id',lid).order('created_at',{ascending:false})]);
 league=L.data;fixtures=F.data||[];predictions=P.data||[];results=R.data||[];members=(M.data||[]).filter(x=>x.status==='active');standings=S.data||[];submission=SS.data||[];invites=I.data||[];const ids=members.map(x=>x.user_id);if(ids.length){const {data}=await supabase.from('profiles').select('*').in('user_id',ids);profiles=Object.fromEntries((data||[]).map(x=>[x.user_id,x]))}
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render();window.scrollTo({top:0,behavior:'smooth'})});
function render(){if(view==='home')home();else if(view==='predict')predictPage();else if(view==='table')tablePage();else if(view==='history')historyPage();else more()}
function fixtureCard(f,edit=true){const u=session.user.id,p=predFor(u,f.id),r=resultFor(f.id),s=state(f),label=s==='open'?'OPEN':s==='soon'?'NOT OPEN':s==='locked'?'LOCKED':'FINISHED';const note=s==='open'?(p?'Saved — editable until lock':'Enter your score'):s==='soon'?`Opens ${fmt(f.prediction_open_at)}`:p?`Your pick ${p.home_score}–${p.away_score}${r?` · +${points(p,r)}`:''}`:'No pick';return `<div class="fixture"><div class="ftop"><span class="date">${fmt(f.kickoff_at)} · Locks ${fmt(f.prediction_lock_at)}</span><span class="pill ${s}">${label}</span></div><div class="teams"><div class="team">${esc(f.home_team)}</div><div class="score">${r?`<b>${r.home_score}</b><span class="dash">–</span><b>${r.away_score}</b>`:`<input id="h-${f.id}" type="number" min="0" max="20" value="${p?.home_score??''}" ${s==='open'&&edit?'':'disabled'}><span class="dash">–</span><input id="a-${f.id}" type="number" min="0" max="20" value="${p?.away_score??''}" ${s==='open'&&edit?'':'disabled'}>`}</div><div class="team away">${esc(f.away_team)}</div></div><div class="factions"><span class="${p?'saved':'notice'}">${note}</span>${s==='open'&&edit?`<button class="btn small" onclick="savePred('${f.id}')">${p?'Update':'Save'}</button>`:''}</div></div>`}
window.savePred=async id=>{const h=document.getElementById('h-'+id),a=document.getElementById('a-'+id);if(!h||!a||h.value===''||a.value==='')return alert('Enter both scores.');const {error}=await supabase.rpc('save_prediction',{p_fixture_id:id,p_home_score:+h.value,p_away_score:+a.value});if(error)return alert(error.message);await load();render()};
function sortedStandings(){return [...standings].sort((a,b)=>b.total_points-a.total_points||b.exact_scores-a.exact_scores||b.correct_outcomes-a.correct_outcomes)}
function tableHtml(rows){return `<table><thead><tr><th>#</th><th>Team</th><th class="num">Pts</th><th class="num">Exact</th><th class="num">Correct</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b>${i+1}</b></td><td><b>${esc(r.badge||'⚽')} ${esc(r.team_name||r.display_name)}</b><div class="tiny">${esc(r.display_name)}</div></td><td class="num"><b>${r.total_points}</b></td><td class="num">${r.exact_scores}</td><td class="num">${r.correct_outcomes}</td></tr>`).join('')}</tbody></table>`}
function home(){const u=session.user.id,open=fixtures.filter(f=>state(f)==='open'),missing=open.filter(f=>!predFor(u,f.id)),mine=standings.find(x=>x.user_id===u)||{total_points:0,exact_scores:0},sorted=sortedStandings();main.innerHTML=`${missing.length?`<div class="banner"><div>⚠️</div><div><b>${missing.length} prediction${missing.length===1?'':'s'} still required</b><div class="notice">Save before the displayed deadline.</div></div></div>`:`<div class="banner good"><div>✓</div><div><b>You're up to date</b><div class="notice">All currently open predictions are saved.</div></div></div>`}<div class="card"><div class="section"><h2>${esc(league.name)}</h2><span>${members.length} players</span></div><div class="notice">Joining closes <b>${fmt(league.join_deadline)}</b>. Opening-weekend predictions lock <b>17:00 Fri 21 Aug</b>.</div></div><div class="card"><div class="section"><h2>${esc(team(u))}</h2><span>${esc(prof(u).display_name||'')}</span></div><div class="stats"><div class="stat"><b>${mine.total_points||0}</b><span>POINTS</span></div><div class="stat"><b>${mine.exact_scores||0}</b><span>EXACT</span></div><div class="stat"><b>${Math.max(1,sorted.findIndex(x=>x.user_id===u)+1)}</b><span>POSITION</span></div></div></div><div class="section"><h2>Coming up</h2><span>Matchweek 1</span></div>${fixtures.slice(0,4).map(f=>fixtureCard(f,false)).join('')}<div class="card"><div class="section"><h2>Mini table</h2><span>Season</span></div>${tableHtml(sorted.slice(0,5))}</div>`}
function predictPage(){main.innerHTML=`<div class="card"><div class="section"><h2>Your predictions</h2><span>Matchweek 1</span></div><div class="notice"><b>Opening weekend exception:</b> all Matchweek 1 predictions lock at 17:00 Friday 21 August. Later fixtures use the normal 7-days-open / 11:00am matchday lock.</div></div>${fixtures.map(f=>fixtureCard(f,true)).join('')}`}
function tablePage(){main.innerHTML=`<div class="card"><div class="section"><h2>League table</h2><span>${esc(league.name)}</span></div>${tableHtml(sortedStandings())}</div>`}
function historyPage(){const vis=fixtures.filter(f=>Date.now()>=new Date(f.prediction_lock_at));if(!vis.length){main.innerHTML=`<div class="card"><h2>Prediction history</h2><p class="notice">Everyone's scores stay private until the prediction deadline.</p></div>`;return}main.innerHTML=`<div class="section"><h2>Prediction history</h2><span>Revealed after lock</span></div>${vis.map(f=>{const r=resultFor(f.id);return `<div class="card"><div class="section"><h2 style="font-size:14px">${esc(f.home_team)} v ${esc(f.away_team)}</h2><span>${r?`${r.home_score}–${r.away_score}`:'Locked'}</span></div>${members.map(m=>{const p=predFor(m.user_id,f.id);return `<div class="person"><span><b>${badge(m.user_id)} ${esc(team(m.user_id))}</b><div class="tiny">${esc(prof(m.user_id).display_name||'')}</div></span><span>${p?`${p.home_score}–${p.away_score}${r?` · +${points(p,r)}`:''}`:'No pick'}</span></div>`}).join('')}</div>`}).join('')}`}
function inviteLink(c){return `${location.origin}${location.pathname}?join=${encodeURIComponent(c)}`}
async function createInvite(){const {data,error}=await supabase.rpc('create_league_invite',{p_league_id:league.id});if(error)return alert(error.message);await load();more();const c=data?.[0]?.code;if(c)shareInvite(c)}
async function shareInvite(c){const text=`⚽ Join ${league.name}\n\nJoin by ${fmt(league.join_deadline)}\nCode: ${c}\n${inviteLink(c)}`;if(navigator.share){try{await navigator.share({title:league.name,text});return}catch(e){}}try{await navigator.clipboard.writeText(text);alert('Invite copied — paste it into WhatsApp.')}catch(e){prompt('Copy this invite:',text)}}
window.shareInvite=shareInvite;
window.saveProfile=async()=>{const u=session.user.id,update={display_name:document.getElementById('pn').value.trim(),team_name:document.getElementById('pt').value.trim(),badge:document.getElementById('pb').value,favourite_club:document.getElementById('pc').value.trim()||null,updated_at:new Date().toISOString()};if(!update.display_name||!update.team_name)return alert('Name and team name are required.');const {error}=await supabase.from('profiles').update(update).eq('user_id',u);if(error)return alert(error.message);await load();more()};
window.saveResult=async f=>{const h=document.getElementById('rh-'+f),a=document.getElementById('ra-'+f);if(h.value===''||a.value==='')return alert('Enter both scores.');const {error}=await supabase.rpc('admin_save_result',{p_fixture_id:f,p_home_score:+h.value,p_away_score:+a.value});if(error)return alert(error.message);await load();more()};
function adminHtml(){if(!isAdmin())return'';return `<div class="card"><div class="section"><h2>Admin · Players</h2><span>Submission status</span></div>${members.map(m=>{const c=fixtures.filter(f=>submission.find(s=>s.user_id===m.user_id&&s.fixture_id===f.id&&s.submitted)).length;return `<div class="person"><span><b>${badge(m.user_id)} ${esc(team(m.user_id))}</b><div class="tiny">${esc(prof(m.user_id).display_name||'')} · ${c}/${fixtures.length} submitted</div></span></div>`}).join('')}</div><div class="card"><div class="section"><h2>Admin · Results</h2><span>Manual for now</span></div>${fixtures.map(f=>{const r=resultFor(f.id);return `<div class="person"><span><b>${esc(f.home_team)} v ${esc(f.away_team)}</b><div class="tiny">${fmt(f.kickoff_at)}</div></span><span class="score"><input id="rh-${f.id}" type="number" min="0" max="20" value="${r?.home_score??''}"><span>–</span><input id="ra-${f.id}" type="number" min="0" max="20" value="${r?.away_score??''}"><button class="btn small" onclick="saveResult('${f.id}')">Save</button></span></div>`}).join('')}</div>`}
function more(){const u=session.user.id,p=prof(u),pending=invites.filter(i=>i.status==='pending');main.innerHTML=`<div class="card"><div class="section"><h2>Your profile</h2><span>${isAdmin()?'Admin':'Player'}</span></div><div class="field"><label>Name</label><input id="pn" value="${esc(p.display_name||'')}"></div><div class="field"><label>Team name</label><input id="pt" value="${esc(p.team_name||'')}"></div><div class="field"><label>Badge</label><select id="pb">${['⚽','🦁','🔥','⚡','👑','🐺','🦅','🎯','🏆'].map(x=>`<option ${x===p.badge?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Favourite club</label><input id="pc" value="${esc(p.favourite_club||'')}"></div><button class="btn good" onclick="saveProfile()">Save profile</button></div><div class="card"><div class="section"><h2>Invite a player</h2><span>Everyone can invite</span></div><p class="notice">Active players can invite friends until <b>${fmt(league.join_deadline)}</b>.</p><button class="btn" id="newInvite">Create WhatsApp invite</button>${pending.length?`<div class="sep"></div><b>Pending invites</b>${pending.map(i=>`<div class="person"><span><b>${i.code}</b><div class="tiny">Pending</div></span><button class="btn secondary small" onclick="shareInvite('${i.code}')">Share</button></div>`).join('')}`:''}</div>${adminHtml()}<div class="card"><button class="btn danger" id="logout">Log out</button></div>`;document.getElementById('newInvite').onclick=createInvite;document.getElementById('logout').onclick=()=>supabase.auth.signOut()}
setInterval(()=>{if(session&&membership)render()},60000);init();
</script>
</body></html>
