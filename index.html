function aiPage(){const first=fixtures.find(f=>f.ai_team_name),name=first?.ai_team_name||'Expected Goals FC',manager=first?.ai_manager_name||'ChatGPT',badgeAi=first?.ai_badge||'🤖',published=fixtures.filter(f=>f.ai_home_score!==null&&f.ai_home_score!==undefined);main.innerHTML=`<div class="card"><div class="section"><h2>${esc(badgeAi)} ${esc(name)}</h2><span>Managed by ${esc(manager)}</span></div><p class="notice">The AI makes independent predictions and never reads human scores before choosing. Its picks are public to everyone once published, with the reasoning shown below.</p></div>${published.length?fixtures.map(aiCard).join(''):`<div class="card"><h2 style="font-size:16px">Picks not published yet</h2><p class="notice">Expected Goals FC normally publishes its first picks around 48 hours before the prediction lock, then reviews them at 24 hours and 2 hours before the deadline.</p></div>`}`}
function aiCard(f){if(f.ai_home_score===null||f.ai_home_score===undefined)return`<div class="aiBox"><div class="section"><h2 style="font-size:14px">${esc(f.home_team)} v ${esc(f.away_team)}</h2><span>Waiting</span></div><div class="notice">AI pick not published yet.</div></div>`;const factors=Array.isArray(f.ai_key_factors)?f.ai_key_factors:[];return `<div class="aiBox"><div class="section"><h2 style="font-size:14px">${esc(f.home_team)} v ${esc(f.away_team)}</h2><span>${f.ai_revision_count?`${f.ai_revision_count} revision${f.ai_revision_count===1?'':'s'}`:'Original pick'}</span></div><div class="aiScore">${f.ai_home_score} – ${f.ai_away_score}</div><p class="notice" style="color:#403858">${esc(f.ai_reasoning||'Reasoning will appear with the prediction.')}</p>${f.ai_confidence!==null&&f.ai_confidence!==undefined?`<div class="tiny" style="margin-bottom:4px">Confidence ${f.ai_confidence}/5</div><div class="confidence"><span style="width:${Math.max(0,Math.min(100,f.ai_confidence*20))}%"></span></div>`:''}${factors.length?`<div style="margin-top:8px">${factors.map(x=>`<span class="factor">${esc(typeof x==='string'?x:(x.label||x.factor||JSON.stringify(x)))}</span>`).join('')}</div>`:''}<div class="insightActions"><button class="btn secondary small" onclick="showForm('${f.fixture_id}','home')">Home form</button><button class="btn secondary small" onclick="showH2H('${f.fixture_id}')">H2H</button><button class="btn secondary small" onclick="showForm('${f.fixture_id}','away')">Away form</button></div><div id="insight-${f.fixture_id}"></div></div>`}
function chatPage(){main.innerHTML=`<div class="card"><div class="section"><h2>💬 League Chat</h2><span>Everyone in the league</span></div><div id="chatbox" class="chatbox">${chat.length?chat.map(m=>{const p=prof(m.user_id),mine=m.user_id===currentUserId(),can=mine||isAdmin();return `<div class="msg ${mine?'mine':''}"><div class="avatar">${esc(p.badge||'⚽')}</div><div class="bubble"><div class="msgname">${esc(p.display_name||'Player')} · ${esc(p.team_name||'')}</div><div class="msgtext">${esc(m.message)}</div><div class="msgtime">${fmt(m.created_at,{weekday:'short',hour:'2-digit',minute:'2-digit'})}${can?` · <button style="border:0;background:none;color:#b52c3c;font-size:9px" onclick="delMsg(${m.id})">delete</button>`:''}</div></div></div>`}).join(''):`<div class="notice" style="text-align:center;margin-top:40px">No messages yet. Start the chat 👋</div>`}</div><div class="chatentry"><input id="chatinput" maxlength="500" placeholder="Message the league…"><button class="btn" onclick="sendMsg()">Send</button></div></div>`;setTimeout(()=>{const b=document.getElementById('chatbox');if(b)b.scrollTop=b.scrollHeight},30)}
window.sendMsg=async()=>{const e=document.getElementById('chatinput'),m=e.value.trim();if(!m)return;const{error}=await sb.from('chat_messages').insert({league_id:league.id,user_id:currentUserId(),message:m});if(error)return alert(error.message);await load();chatPage()};window.delMsg=async id=>{const{error}=await sb.from('chat_messages').delete().eq('id',id);if(error)return alert(error.message);await load();chatPage()};
function inviteLink(c){return`${location.origin}${location.pathname}?join=${encodeURIComponent(c)}`}
async function createInvite(){const{data,error}=await sb.rpc('create_league_invite',{p_league_id:league.id});if(error)return alert(error.message);await load();more();const c=data?.[0]?.code;if(c)shareInvite(c)}
async function shareInvite(c){const text=`⚽ Join ${league.name}\n\nJoin by ${fmt(league.join_deadline)}\nCode: ${c}\n${inviteLink(c)}\n\nFor fun and bragging rights only.`;if(navigator.share){try{await navigator.share({title:league.name,text});return}catch(e){}}try{await navigator.clipboard.writeText(text);alert('Invite copied — paste it into WhatsApp.')}catch(e){prompt('Copy this invite:',text)}}window.shareInvite=shareInvite;
window.saveProfile=async()=>{const u=currentUserId(),update={display_name:document.getElementById('pn').value.trim(),team_name:document.getElementById('pt').value.trim(),badge:document.getElementById('pb').value,favourite_club:document.getElementById('pc').value.trim()||null,updated_at:new Date().toISOString()};if(!update.display_name||!update.team_name)return alert('Name and team name are required.');const{error}=await sb.from('profiles').update(update).eq('user_id',u);if(error)return alert(error.message);await load();more()};
window.setPassword=async()=>{const e=document.getElementById('newPassword'),password=e.value;if(password.length<8)return alert('Use at least 8 characters.');const{error}=await sb.auth.updateUser({password});if(error)return alert(error.message);e.value='';alert('Password saved. You can use email + password next time.')};
function supportsPush(){return'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window}
async function refreshPushState(){devicePushOn=false;if(!supportsPush()||!currentUserId())return;try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg?await reg.pushManager.getSubscription():null;devicePushOn=!!sub&&!!prof(currentUserId()).prediction_reminders}catch(_){devicePushOn=false}}
function base64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function ensureSW(){if(!supportsPush())throw new Error('This browser does not support web push notifications.');return await navigator.serviceWorker.register('./sw.js',{scope:'./'})}
window.enableReminders=async()=>{try{const reg=await ensureSW(),perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('Notification permission was not granted.');const{data:key,error:ke}=await sb.rpc('get_push_public_key');if(ke||!key)throw ke||new Error('Push key unavailable');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:base64ToUint8Array(key)});const j=sub.toJSON(),keys=j.keys||{};const{error:se}=await sb.rpc('upsert_push_subscription',{p_endpoint:sub.endpoint,p_p256dh:keys.p256dh,p_auth:keys.auth,p_user_agent:navigator.userAgent});if(se)throw se;const{error:re}=await sb.rpc('set_prediction_reminders',{p_enabled:true});if(re)throw re;await load();render();alert('Prediction reminders enabled on this device.')}catch(e){alert(e.message||String(e))}};
window.disableReminders=async()=>{try{const reg=await navigator.serviceWorker.getRegistration(),sub=reg?await reg.pushManager.getSubscription():null;if(sub)await sb.rpc('disable_push_subscription',{p_endpoint:sub.endpoint});await sb.rpc('set_prediction_reminders',{p_enabled:false});if(sub)await sub.unsubscribe();await load();render()}catch(e){alert(e.message||String(e))}};
window.testPush=async()=>{try{const{data,error}=await sb.functions.invoke('test-push-notification',{body:{}});if(error)throw error;if(!data?.ok)throw new Error(data?.error||'Test notification failed');alert('Test notification sent.')}catch(e){alert(e.message||String(e))}};
async function loadHistory(){if(historyLoaded)return;const{data,error}=await sb.rpc('get_league_history',{p_league_id:league.id,p_limit:80});if(error){alert(error.message);return}history=data||[];historyLoaded=true}
window.showHistory=async()=>{main.innerHTML='<div class="loading">Loading history…</div>';await loadHistory();renderHistory()};
function renderHistory(){main.innerHTML=`<div class="card"><div class="section"><h2>History</h2><span>Locked & completed fixtures</span></div><button class="btn secondary small" onclick="setViewGlobal('more')">← Back</button></div>${history.length?history.map(h=>`<div class="historyFixture"><div class="historyHead"><span>${esc(h.home_team)} v ${esc(h.away_team)}</span><span>${h.result_home_score!==null&&h.result_home_score!==undefined?`${h.result_home_score}–${h.result_away_score}`:'Locked'}</span></div><div class="tiny">MW${h.matchweek} · ${fmt(h.kickoff_at)}</div>${(h.predictions||[]).map(p=>`<div class="person"><span><b>${esc(p.badge||'⚽')} ${esc(p.team_name||p.display_name)}</b><div class="tiny">${esc(p.display_name||'')}</div></span><span>${p.home_score!==null&&p.home_score!==undefined?`${p.home_score}–${p.away_score}${p.points!==null&&p.points!==undefined?` · +${p.points}`:''}`:'No pick'}</span></div>`).join('')}${h.highlight_url?`<div style="margin-top:8px"><a class="btn link small" href="${esc(h.highlight_url)}" target="_blank" rel="noopener">🎬 Watch highlights</a></div>`:''}</div>`).join(''):'<div class="card"><p class="notice">No locked fixtures yet.</p></div>'}`}
window.saveResult=async f=>{const h=document.getElementById('rh-'+f),a=document.getElementById('ra-'+f);if(h.value===''||a.value==='')return alert('Enter both scores.');const{error}=await sb.rpc('admin_save_result',{p_fixture_id:f,p_home_score:+h.value,p_away_score:+a.value});if(error)return alert(error.message);historyLoaded=false;statsLoaded=false;await load();more()};
window.confirmVerifiedResult=async f=>{const{error}=await sb.rpc('verifier_confirm_result',{p_fixture_id:f});if(error)return alert(error.message);await load();more()};
window.correctVerifiedResult=async f=>{const h=document.getElementById('vrh-'+f),a=document.getElementById('vra-'+f);if(!h||!a||h.value===''||a.value==='')return alert('Enter both final scores.');if(!confirm(`Correct this result to ${h.value}–${a.value}? This change will be permanently audited.`))return;const{error}=await sb.rpc('verifier_correct_result',{p_fixture_id:f,p_home_score:+h.value,p_away_score:+a.value});if(error)return alert(error.message);historyLoaded=false;statsLoaded=false;await load();more()};
window.postNotice=async()=>{const t=document.getElementById('nt').value.trim(),b=document.getElementById('nb').value.trim();if(!t||!b)return;const{error}=await sb.from('notices').insert({league_id:league.id,title:t,body:b,kind:'info',priority:50,pinned:false,created_by:currentUserId()});if(error)return alert(error.message);await load();more()};
function verifierHtml(){if(!isVerifier())return'';const rows=[...verificationQueue].sort((a,b)=>(a.verified===b.verified?new Date(b.kickoff_at)-new Date(a.kickoff_at):(a.verified?1:-1))).slice(0,20);return `<div class="card"><div class="section"><h2>🛡️ Results verification</h2><span>${membership.role==='results_verifier'?'Verifier':'Admin'}</span></div><p class="notice">Automatic results update the table immediately. This is the human safety check. A confirmation applies only to the current version of that result — if the result later changes it becomes unverified again.</p>${rows.length?rows.map(r=>`<div class="person" style="align-items:flex-start"><span><b>MW${r.matchweek} · ${esc(r.home_team)} v ${esc(r.away_team)}</b><div class="tiny">${fmt(r.kickoff_at)} · ${esc(r.result_source||'result')}</div><div class="tiny">${r.verified?`✅ Verified${r.verified_by?` by ${esc(r.verified_by)}`:''}${r.verification_type==='corrected'?' · corrected':''}`:'⚠️ Awaiting human verification'}</div></span><span><div class="score"><input id="vrh-${r.fixture_id}" type="number" min="0" max="20" value="${r.result_home_score}"><span>–</span><input id="vra-${r.fixture_id}" type="number" min="0" max="20" value="${r.result_away_score}"></div><div style="display:flex;gap:5px;margin-top:6px;justify-content:flex-end">${r.verified?'':`<button class="btn good small" onclick="confirmVerifiedResult('${r.fixture_id}')">✓ Confirm</button>`}<button class="btn secondary small" onclick="correctVerifiedResult('${r.fixture_id}')">Correct</button></div></span></div>`).join(''):'<div class="notice">No completed results to verify yet. This panel will populate automatically after the first final score arrives.</div>'}</div>`}
function backupReadableHtml(d){const members=d.members||[],fixtures=d.fixtures||[],results=d.results||[],picks=d.sealed_predictions||[],integrity=d.integrity_checks||[];const resultMap=Object.fromEntries(results.map(r=>[r.fixture_id,r]));return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Premier League Predictions Backup</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#241153}table{border-collapse:collapse;width:100%;margin:10px 0 28px}th,td{border:1px solid #ddd;padding:7px;text-align:left;font-size:13px}th{background:#f3f0fa}.ok{color:#08775c;font-weight:bold}.muted{color:#666}</style></head><body><h1>Premier League Predictions · Season Backup</h1><p class="muted">Created ${new Date(d.exported_at||Date.now()).toLocaleString('en-GB')} · unlocked current predictions are deliberately excluded.</p><h2>Summary</h2><table><tr><th>Players</th><th>Fixtures</th><th>Sealed prediction rows</th><th>Results</th><th>Integrity checks</th></tr><tr><td>${members.length}</td><td>${fixtures.length}</td><td>${picks.length}</td><td>${results.length}</td><td>${integrity.length}</td></tr></table><h2>Players</h2><table><tr><th>Name</th><th>Team</th><th>Role</th><th>Status</th></tr>${members.map(m=>`<tr><td>${esc(m.display_name||'')}</td><td>${esc(m.team_name||'')}</td><td>${esc(m.role||'')}</td><td>${esc(m.status||'')}</td></tr>`).join('')}</table><h2>Fixtures & results</h2><table><tr><th>MW</th><th>Fixture</th><th>Kick-off</th><th>Result</th><th>Status</th></tr>${fixtures.map(f=>{const r=resultMap[f.id];return `<tr><td>${f.matchweek}</td><td>${esc(f.home_team)} v ${esc(f.away_team)}</td><td>${esc(fmt(f.kickoff_at))}</td><td>${r?`${r.home_score}–${r.away_score}`:'—'}</td><td>${esc(f.status||'')}</td></tr>`}).join('')}</table><h2>Sealed predictions</h2><table><tr><th>MW</th><th>Fixture</th><th>Player</th><th>Team</th><th>Prediction</th><th>Captured</th></tr>${picks.map(x=>`<tr><td>${x.matchweek}</td><td>${esc(x.home_team)} v ${esc(x.away_team)}</td><td>${esc(x.display_name||'')}</td><td>${esc(x.team_name||'')}</td><td>${x.has_prediction?`${x.home_score}–${x.away_score}`:'No pick'}</td><td>${x.captured_at?esc(new Date(x.captured_at).toLocaleString('en-GB')):''}</td></tr>`).join('')}</table><h2>Integrity</h2><table><tr><th>Phase</th><th>Expected</th><th>Submitted</th><th>Missing</th><th>Restored</th><th>Checked</th></tr>${integrity.map(x=>`<tr><td>${esc(x.phase||'')}</td><td>${x.expected_slots??''}</td><td>${x.live_submitted_slots??''}</td><td>${x.missing_slots??''}</td><td>${x.restored_slots??''}</td><td>${x.checked_at?esc(new Date(x.checked_at).toLocaleString('en-GB')):''}</td></tr>`).join('')}</table></body></html>`}
function downloadBlob(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
window.exportSeasonBackup=async format=>{try{const{data,error}=await sb.rpc('admin_export_season_backup',{p_league_id:league.id});if(error)throw error;const day=new Date().toISOString().slice(0,10),base=`PLP-Season-Backup-${day}`;if(format==='html')downloadBlob(backupReadableHtml(data),'text/html;charset=utf-8',base+'.html');else downloadBlob(JSON.stringify(data,null,2),'application/json',base+'.json');localStorage.setItem('plp_last_backup',new Date().toISOString());alert(format==='html'?'Readable season report downloaded.':'Recovery data downloaded. Keep it somewhere outside the app.');more()}catch(e){alert(e.message||String(e))}};
function adminHtml(){if(!isAdmin())return'';const last=localStorage.getItem('plp_last_backup'),covered=reminderCoverage.filter(x=>(x.active_devices||0)>0).length,totalCoverage=reminderCoverage.length,notCovered=reminderCoverage.filter(x=>(x.active_devices||0)===0);return `<div class="card"><div class="section"><h2>🔔 Reminder coverage</h2><span>${covered}/${totalCoverage} players</span></div><div class="stats"><div class="stat"><b>${covered}</b><span>READY</span></div><div class="stat"><b>${Math.max(0,totalCoverage-covered)}</b><span>NO DEVICE</span></div><div class="stat"><b>${totalCoverage?Math.round(100*covered/totalCoverage):0}%</b><span>COVERAGE</span></div></div>${notCovered.length?`<div class="sep"></div><div class="notice"><b>Still need to enable reminders:</b></div>${notCovered.map(x=>`<div class="person"><span><b>${esc(x.team_name||x.display_name)}</b><div class="tiny">${esc(x.display_name||'')}</div></span><span class="count warn">Not set</span></div>`).join('')}`:`<p class="notice" style="margin-bottom:0">✅ Every active player has at least one registered reminder device.</p>`}</div><div class="card"><div class="section"><h2>Admin · Results</h2><span>Manual rescue</span></div><p class="notice">Results normally arrive automatically and can then be human-verified below. Use this section only to rescue a missing result or force a manual override.</p>${fixtures.map(f=>`<div class="person"><span><b>${esc(f.home_team)} v ${esc(f.away_team)}</b></span><span class="score"><input id="rh-${f.fixture_id}" type="number" min="0" max="20" value="${f.result_home_score??''}"><span>–</span><input id="ra-${f.fixture_id}" type="number" min="0" max="20" value="${f.result_away_score??''}"><button class="btn small" onclick="saveResult('${f.fixture_id}')">Save</button></span></div>`).join('')}</div><div class="card"><div class="section"><h2>📦 Season Backup</h2><span>${last?`Last: ${fmt(last)}`:'Not downloaded yet'}</span></div><p class="notice">Creates an independent copy of players, fixtures, results, sealed predictions and integrity records. <b>Unlocked predictions are never included.</b></p><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn good" onclick="exportSeasonBackup('html')">Readable report</button><button class="btn secondary" onclick="exportSeasonBackup('json')">Recovery data (.json)</button></div></div><div class="card"><div class="section"><h2>Admin · Notice</h2><span>Post update</span></div><div class="field"><label>Title</label><input id="nt"></div><div class="field"><label>Message</label><textarea id="nb" rows="3"></textarea></div><button class="btn" onclick="postNotice()">Post notice</button></div>`}
function more(){const u=currentUserId(),p=prof(u),pending=invites.filter(i=>i.status==='pending'),pushOn=devicePushOn,ios=/iPad|iPhone|iPod/.test(navigator.userAgent),standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;main.innerHTML=`<div class="card"><div class="section"><h2>Your profile</h2><span class="roleTag">${esc(roleLabel())}</span></div><div class="field"><label>Name</label><input id="pn" value="${esc(p.display_name||'')}"></div><div class="field"><label>Team name</label><input id="pt" value="${esc(p.team_name||'')}"></div><div class="field"><label>Badge</label><select id="pb">${['⚽','🦁','🔥','⚡','👑','🐺','🦅','🎯','🏆'].map(x=>`<option ${x===p.badge?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Favourite club</label><input id="pc" value="${esc(p.favourite_club||'')}"></div><button class="btn good" onclick="saveProfile()">Save profile</button></div><div class="card"><div class="section"><h2>🔔 Prediction reminders</h2><span>48h · 24h · 2h</span></div><div class="toggleRow"><div><b>${pushOn?'Enabled on this device':'Off on this device'}</b><div class="notice">Only sent if you still have predictions missing.</div></div><div class="switch ${pushOn?'on':''}" onclick="${pushOn?'disableReminders()':'enableReminders()'}"><span></span></div></div>${pushOn?`<button class="btn secondary small" style="margin-top:10px" onclick="testPush()">Send test notification</button>`:''}${!supportsPush()?'<p class="footnote">This browser/device does not expose Web Push.</p>':''}${ios&&!standalone?'<p class="footnote"><b>iPhone/iPad:</b> add this site to your Home Screen first; Apple only allows web push for installed web apps.</p>':''}</div><div class="card"><div class="section"><h2>🔐 Sign-in</h2><span>Password</span></div><p class="notice">Set or change your password here. Your existing email sign-in link remains available as a fallback.</p><div class="field"><label>New password</label><input id="newPassword" type="password" minlength="8"></div><button class="btn secondary" onclick="setPassword()">Set / change password</button></div><div class="card"><div class="section"><h2>Invite a player</h2><span>Everyone can invite</span></div><p class="notice">Active players can invite friends until <b>${fmt(league.join_deadline)}</b>.</p><button class="btn" id="newInvite">Create WhatsApp invite</button>${pending.length?`<div class="sep"></div>${pending.slice(0,5).map(i=>`<div class="person"><span><b>${esc(i.code)}</b><div class="tiny">Pending</div></span><button class="btn secondary small" onclick="shareInvite('${esc(i.code)}')">Share</button></div>`).join('')}`:''}</div><div class="card"><div class="section"><h2>History</h2><span>Revealed picks & results</span></div><button class="btn secondary" onclick="showHistory()">View league history</button></div>${verifierHtml()}${adminHtml()}<div class="card"><button class="btn danger" id="logout">Log out</button></div>`;document.getElementById('newInvite').onclick=createInvite;document.getElementById('logout').onclick=()=>sb.auth.signOut()}
setInterval(async()=>{if(session&&membership&&view==='chat'){await load();chatPage()}},15000);
setInterval(async()=>{if(session&&membership&&['home','table','stats','ai','more'].includes(view)){if(view==='stats')statsLoaded=false;await load();render()}},60000);
init();
</script>
