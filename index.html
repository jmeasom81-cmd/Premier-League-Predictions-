function fixtureCard(f,edit=true){const s=state(f),label=s==='open'?'OPEN':s==='soon'?'NOT OPEN':s==='locked'?'LOCKED':s==='postponed'?'POSTPONED':'FINISHED',p=hasOwnPick(f),r=hasResult(f);const myPts=r&&p?points(f.your_home_score,f.your_away_score,f.result_home_score,f.result_away_score):0;return `<div class="fixture" id="fixture-${f.fixture_id}"><div class="ftop"><span class="date">${fmt(f.kickoff_at)} · Locks ${fmt(f.prediction_lock_at)}</span><span class="pill ${s}">${label}</span></div><div class="teams"><div class="team"><button class="teamBtn" onclick="showForm('${f.fixture_id}','home')">${esc(f.home_team)}</button></div><div class="score">${r?`<b>${f.result_home_score}</b><span>–</span><b>${f.result_away_score}</b>`:`<input id="h-${f.fixture_id}" type="number" min="0" max="20" value="${p?f.your_home_score:''}" ${s==='open'&&edit?'':'disabled'}><span>–</span><input id="a-${f.fixture_id}" type="number" min="0" max="20" value="${p?f.your_away_score:''}" ${s==='open'&&edit?'':'disabled'}>`}</div><div class="team away"><button class="teamBtn" onclick="showForm('${f.fixture_id}','away')">${esc(f.away_team)}</button></div></div><div class="factions"><span class="${p?'saved':'notice'}">${p?`Your pick ${f.your_home_score}–${f.your_away_score}${r?` · +${myPts} point${myPts===1?'':'s'}`:''}`:s==='open'?'Enter your score':s==='soon'?`Opens ${fmt(f.prediction_open_at)}`:s==='postponed'?'Prediction paused':'No pick'}</span>${s==='open'&&edit?`<button class="btn small" onclick="savePred('${f.fixture_id}')">${p?'Update':'Save'}</button>`:''}</div><div class="insightActions"><button class="btn secondary small" onclick="showForm('${f.fixture_id}','home')">📊 ${esc(f.home_team)} form</button><button class="btn secondary small" onclick="showH2H('${f.fixture_id}')">↔ H2H</button><button class="btn secondary small" onclick="showForm('${f.fixture_id}','away')">📊 ${esc(f.away_team)} form</button>${f.highlight_url?`<a class="btn link small" href="${esc(f.highlight_url)}" target="_blank" rel="noopener">🎬 Watch highlights</a>`:''}</div><div id="insight-${f.fixture_id}"></div></div>`}
window.savePred=async id=>{const h=document.getElementById('h-'+id),a=document.getElementById('a-'+id);if(!h||!a||h.value===''||a.value==='')return alert('Enter both scores.');const{error}=await sb.rpc('save_prediction',{p_fixture_id:id,p_home_score:+h.value,p_away_score:+a.value});if(error)return alert(error.message);await load();render()};
window.showForm=(id,side)=>{const f=fixtures.find(x=>x.fixture_id===id);if(!f)return;const arr=side==='home'?f.home_form:f.away_form,name=side==='home'?f.home_team:f.away_team,box=document.getElementById('insight-'+id);if(!box)return;box.innerHTML=`<div class="insight"><div class="section"><h2 style="font-size:14px">${esc(name)} · last 6 league matches</h2><span>Newest first</span></div>${(arr||[]).length?(arr||[]).map(m=>`<div class="formrow"><span class="resultBadge ${esc(m.result)}">${esc(m.result)}</span><b>${esc(m.score)}</b><span>${m.venue==='H'?'vs':'at'} <b>${esc(m.opponent)}</b><div class="tiny">${esc(m.competition||'League')} · ${fmtDate(m.date)}</div></span><span>${m.venue==='H'?'H':'A'}</span></div>`).join(''):`<div class="notice">No form data is available yet.</div>`}</div>`};
window.showH2H=id=>{const f=fixtures.find(x=>x.fixture_id===id);if(!f)return;const box=document.getElementById('insight-'+id),arr=f.h2h||[];if(!box)return;box.innerHTML=`<div class="insight"><div class="section"><h2 style="font-size:14px">Last competitive meetings</h2><span>${esc(f.home_team)} · ${esc(f.away_team)}</span></div>${arr.length?arr.map(m=>`<div class="h2hrow"><span>⚽</span><b>${esc(m.home_score)}–${esc(m.away_score)}</b><span><b>${esc(m.home_team)}</b> v <b>${esc(m.away_team)}</b><div class="tiny">${esc(m.competition||'Competitive match')}${m.round?` · ${esc(m.round)}`:''}</div></span><span>${fmtDate(m.date)}</span></div>`).join(''):`<div class="notice">Head-to-head history is being prepared for this fixture.</div>`}</div>`};
function sortedStandings(){return[...standings].sort((a,b)=>b.total_points-a.total_points||b.exact_scores-a.exact_scores||b.correct_outcomes-a.correct_outcomes||String(a.team_name).localeCompare(String(b.team_name)))}
function tableHtml(rows){return `<table><thead><tr><th>#</th><th>Team</th><th class="num">Pts</th><th class="num">Exact</th><th class="num">Correct</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b>${i+1}</b></td><td><b>${esc(r.badge||'⚽')} ${esc(r.team_name||r.manager_name)}</b><div class="tiny">${r.entrant_type==='ai'?'AI · ':''}${esc(r.manager_name||'')}</div></td><td class="num"><b>${r.total_points||0}</b></td><td class="num">${r.exact_scores||0}</td><td class="num">${r.correct_outcomes||0}</td></tr>`).join('')}</tbody></table>`}
function home(){const uid=currentUserId(),missing=fixtures.filter(f=>!hasOwnPick(f)&&state(f)==='open'),mine=standings.find(x=>x.entrant_type==='human'&&x.entrant_id===uid)||{total_points:0,exact_scores:0},sorted=sortedStandings(),pos=Math.max(1,sorted.findIndex(x=>x.entrant_type==='human'&&x.entrant_id===uid)+1),noticeHtml=notices.map(n=>`<div class="noticebox ${esc(n.kind)}"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p>${n.link_url?`<div class="noticeaction"><a class="btn link small" href="${esc(n.link_url)}" target="_blank" rel="noopener">${esc(n.link_label||'Open')}</a></div>`:''}</div>`).join(''),total=fixtures.length,subs=members.map(m=>{const n=submission.filter(s=>s.user_id===m.user_id&&s.submitted).length,cl=n===total?'good':n===0?'bad':'warn';return `<div class="person"><span><b>${badge(m.user_id)} ${esc(team(m.user_id))}</b><div class="tiny">${esc(prof(m.user_id).display_name||'')}</div></span><span class="count ${cl}">${n}/${total} ✓</span></div>`}).join('');main.innerHTML=`${missing.length?`<div class="banner"><b>⚠️ ${missing.length} prediction${missing.length===1?'':'s'} missing</b><div class="notice">${missing.slice(0,3).map(f=>`${esc(f.home_team)} v ${esc(f.away_team)}`).join(' · ')}${missing.length>3?'…':''}</div><button class="btn small" style="margin-top:8px" onclick="setViewGlobal('predict')">Complete predictions</button></div>`:`<div class="banner good"><b>✓ You're up to date</b><div class="notice">All current predictions are saved.</div></div>`}<div class="card"><div class="section"><h2>📌 Notice Board</h2><span>League updates</span></div>${noticeHtml||'<div class="notice">No current notices.</div>'}</div><div class="card"><div class="section"><h2>${esc(team(uid))}</h2><span>${esc(prof(uid).display_name||'')}</span></div><div class="stats"><div class="stat"><b>${mine.total_points||0}</b><span>POINTS</span></div><div class="stat"><b>${mine.exact_scores||0}</b><span>EXACT</span></div><div class="stat"><b>${pos}</b><span>POSITION</span></div></div></div><div class="card"><div class="section"><h2>Predictions in</h2><span>Scores stay private</span></div>${subs}</div><div class="section"><h2>Coming up</h2><span>Matchweek ${fixtures[0]?.matchweek??''}</span></div>${fixtures.slice(0,4).map(f=>fixtureCard(f,false)).join('')}<div class="card"><div class="section"><h2>Mini table</h2><span>Includes AI</span></div>${tableHtml(sorted.slice(0,5))}</div>`}
window.setViewGlobal=v=>setView(v);
function predictPage(){const locks=[...new Set(fixtures.map(f=>f.prediction_lock_at))].sort();main.innerHTML=`<div class="card"><div class="section"><h2>Your predictions</h2><span>Matchweek ${fixtures[0]?.matchweek??''}</span></div><div class="notice">Tap either team name for its last six league results. Use <b>H2H</b> for the last six competitive meetings. ${locks.length===1?`This round locks <b>${fmt(locks[0])}</b>.`:'Each fixture shows its own lock time.'}</div></div>${fixtures.map(f=>fixtureCard(f,true)).join('')}`}
function tablePage(){main.innerHTML=`<div class="card"><div class="section"><h2>League table</h2><span>${esc(league.name)}</span></div>${tableHtml(sortedStandings())}</div><div class="card"><p class="notice">🤖 Expected Goals FC competes under exactly the same 3 / 1 / 0 scoring rules.</p></div>`}
function aiPage(){const first=fixtures.find(f=>f.ai_team_name),name=first?.ai_team_name||'Expected Goals FC',manager=first?.ai_manager_name||'ChatGPT',badgeAi=first?.ai_badge||'🤖',published=fixtures.filter(f=>f.ai_home_score!==null&&f.ai_home_score!==undefined);main.innerHTML=`<div class="card"><div class="section"><h2>${esc(badgeAi)} ${esc(name)}</h2><span>Managed by ${esc(manager)}</span></div><p class="notice">The AI makes independent predictions and never reads human scores before choosing. Its picks are public to everyone once published, with the reasoning shown below.</p></div>${published.length?fixtures.map(aiCard).join(''):`<div class="card"><h2 style="font-size:16px">Picks not published yet</h2><p class="notice">Expected Goals FC normally publishes its first picks around 48 hours before the prediction lock, then reviews them at 24 hours and 2 hours before the deadline.</p></div>`}`}
function aiCard(f){if(f.ai_home_score===null||f.ai_home_score===undefined)return`<div class="aiBox"><div class="section"><h2 style="font-size:14px">${esc(f.home_team)} v ${esc(f.away_team)}</h2><span>Waiting</span></div><div class="notice">AI pick not published yet.</div></div>`;const factors=Array.isArray(f.ai_key_factors)?f.ai_key_factors:[];return `<div class="aiBox"><div class="section"><h2 style="font-size:14px">${esc(f.home_team)} v ${esc(f.away_team)}</h2><span>${f.ai_revision_count?`${f.ai_revision_count} revision${f.ai_revision_count===1?'':'s'}`:'Original pick'}</span></div><div class="aiScore">${f.ai_home_score} – ${f.ai_away_score}</div><p class="notice" style="color:#403858">${esc(f.ai_reasoning||'Reasoning will appear with the prediction.')}</p>${f.ai_confidence!==null&&f.ai_confidence!==undefined?`<div class="tiny" style="margin-bottom:4px">Confidence ${f.ai_confidence}/5</div><div class="confidence"><span style="width:${Math.max(0,Math.min(100,f.ai_confidence*20))}%"></span></div>`:''}${factors.length?`<div style="margin-top:8px">${factors.map(x=>`<span class="factor">${esc(typeof x==='string'?x:(x.label||x.factor||JSON.stringify(x)))}</span>`).join('')}</div>`:''}<div class="insightActions"><button class="btn secondary small" onclick="showForm('${f.fixture_id}','home')">Home form</button><button class="btn secondary small" onclick="showH2H('${f.fixture_id}')">H2H</button><button class="btn secondary small" onclick="showForm('${f.fixture_id}','away')">Away form</button></div><div id="insight-${f.fixture_id}"></div></div>`}
function chatPage(){main.innerHTML=`<div class="card"><div class="section"><h2>💬 League Chat</h2><span>Everyone in the league</span></div><div id="chatbox" class="chatbox">${chat.length?chat.map(m=>{const p=prof(m.user_id),mine=m.user_id===currentUserId(),can=mine||isAdmin();return `<div class="msg ${mine?'mine':''}"><div class="avatar">${esc(p.badge||'⚽')}</div><div class="bubble"><div class="msgname">${esc(p.display_name||'Player')} · ${esc(p.team_name||'')}</div><div class="msgtext">${esc(m.message)}</div><div class="msgtime">${fmt(m.created_at,{weekday:'short',hour:'2-digit',minute:'2-digit'})}${can?` · <button style="border:0;background:none;color:#b52c3c;font-size:9px" onclick="delMsg(${m.id})">delete</button>`:''}</div></div></div>`}).join(''):`<div class="notice" style="text-align:center;margin-top:40px">No messages yet. Start the chat 👋</div>`}</div><div class="chatentry"><input id="chatinput" maxlength="500" placeholder="Message the league…"><button class="btn" onclick="sendMsg()">Send</button></div></div>`;setTimeout(()=>{const b=document.getElementById('chatbox');if(b)b.scrollTop=b.scrollHeight},30)}
window.sendMsg=async()=>{const e=document.getElementById('chatinput'),m=e.value.trim();if(!m)return;const{error}=await sb.from('chat_messages').insert({league_id:league.id,user_id:currentUserId(),message:m});if(error)return alert(error.message);await load();chatPage()};window.delMsg=async id=>{const{error}=await sb.from('chat_messages').delete().eq('id',id);if(error)return alert(error.message);await load();chatPage()};
function inviteLink(c){return`${location.origin}${location.pathname}?join=${encodeURIComponent(c)}`}
async function createInvite(){const{data,error}=await sb.rpc('create_league_invite',{p_league_id:league.id});if(error)return alert(error.message);await load();more();const c=data?.[0]?.code;if(c)shareInvite(c)}
async function shareInvite(c){const text=`⚽ Join ${league.name}\n\nJoin by ${fmt(league.join_deadline)}\nCode: ${c}\n${inviteLink(c)}\n\nFor fun and bragging rights only.`;if(navigator.share){try{await navigator.share({title:league.name,text});return}catch(e){}}try{await navigator.clipboard.writeText(text);alert('Invite copied — paste it into WhatsApp.')}catch(e){prompt('Copy this invite:',text)}}window.shareInvite=shareInvite;
window.saveProfile=async()=>{const u=currentUserId(),update={display_name:document.getElementById('pn').value.trim(),team_name:document.getElementById('pt').value.trim(),badge:document.getElementById('pb').value,favourite_club:document.getElementById('pc').value.trim()||null,updated_at:new Date().toISOString()};if(!update.display_name||!update.team_name)return alert('Name and team name are required.');const{error}=await sb.from('profiles').update(update).eq('user_id',u);if(error)return alert(error.message);await load();more()};
window.setPassword=async()=>{const e=document.getElementById('newPassword'),password=e.value;if(password.length<8)return alert('Use at least 8 characters.');const{error}=await sb.auth.updateUser({password});if(error)return alert(error.message);e.value='';alert('Password saved. You can use email + password next time.')};
function supportsPush(){return'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window}
function base64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function ensureSW(){if(!supportsPush())throw new Error('This browser does not support web push notifications.');return await navigator.serviceWorker.register('./sw.js',{scope:'./'})}
window.enableReminders=async()=>{try{const reg=await ensureSW(),perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('Notification permission was not granted.');const{data:key,error:ke}=await sb.rpc('get_push_public_key');if(ke||!key)throw ke||new Error('Push key unavailable');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:base64ToUint8Array(key)});const j=sub.toJSON(),keys=j.keys||{};const{error:se}=await sb.rpc('upsert_push_subscription',{p_endpoint:sub.endpoint,p_p256dh:keys.p256dh,p_auth:keys.auth,p_user_agent:navigator.userAgent});if(se)throw se;const{error:re}=await sb.rpc('set_prediction_reminders',{p_enabled:true});if(re)throw re;await load();more();alert('Prediction reminders enabled on this device.')}catch(e){alert(e.message||String(e))}};
window.disableReminders=async()=>{try{const reg=await navigator.serviceWorker.getRegistration('./'),sub=reg?await reg.pushManager.getSubscription():null;if(sub)await sb.rpc('disable_push_subscription',{p_endpoint:sub.endpoint});await sb.rpc('set_prediction_reminders',{p_enabled:false});if(sub)await sub.unsubscribe();await load();more()}catch(e){alert(e.message||String(e))}};
window.testPush=async()=>{try{const{data,error}=await sb.functions.invoke('test-push-notification',{body:{}});if(error)throw error;if(!data?.ok)throw new Error(data?.error||'Test notification failed');alert('Test notification sent.')}catch(e){alert(e.message||String(e))}};
async function loadHistory(){if(historyLoaded)return;const{data,error}=await sb.rpc('get_league_history',{p_league_id:league.id,p_limit:80});if(error){alert(error.message);return}history=data||[];historyLoaded=true}
window.showHistory=async()=>{main.innerHTML='<div class="loading">Loading history…</div>';await loadHistory();renderHistory()};
function renderHistory(){main.innerHTML=`<div class="card"><div class="section"><h2>History</h2><span>Locked & completed fixtures</span></div><button class="btn secondary small" onclick="setViewGlobal('more')">← Back</button></div>${history.length?history.map(h=>`<div class="historyFixture"><div class="historyHead"><span>${esc(h.home_team)} v ${esc(h.away_team)}</span><span>${h.result_home_score!==null&&h.result_home_score!==undefined?`${h.result_home_score}–${h.result_away_score}`:'Locked'}</span></div><div class="tiny">MW${h.matchweek} · ${fmt(h.kickoff_at)}</div>${(h.predictions||[]).map(p=>`<div class="person"><span><b>${esc(p.badge||'⚽')} ${esc(p.team_name||p.display_name)}</b><div class="tiny">${esc(p.display_name||'')}</div></span><span>${p.home_score!==null&&p.home_score!==undefined?`${p.home_score}–${p.away_score}${p.points!==null&&p.points!==undefined?` · +${p.points}`:''}`:'No pick'}</span></div>`).join('')}${h.highlight_url?`<div style="margin-top:8px"><a class="btn link small" href="${esc(h.highlight_url)}" target="_blank" rel="noopener">🎬 Watch highlights</a></div>`:''}</div>`).join(''):'<div class="card"><p class="notice">No locked fixtures yet.</p></div>'}`}
window.saveResult=async f=>{const h=document.getElementById('rh-'+f),a=document.getElementById('ra-'+f);if(h.value===''||a.value==='')return alert('Enter both scores.');const{error}=await sb.rpc('admin_save_result',{p_fixture_id:f,p_home_score:+h.value,p_away_score:+a.value});if(error)return alert(error.message);historyLoaded=false;await load();more()};
window.postNotice=async()=>{const t=document.getElementById('nt').value.trim(),b=document.getElementById('nb').value.trim();if(!t||!b)return;const{error}=await sb.from('notices').insert({league_id:league.id,title:t,body:b,kind:'info',priority:50,pinned:false,created_by:currentUserId()});if(error)return alert(error.message);await load();more()};
function adminHtml(){if(!isAdmin())return'';return `<div class="card"><div class="section"><h2>Admin · Results</h2><span>Automatic · manual override</span></div><p class="notice">Results normally arrive automatically. Use this only to correct or rescue a result.</p>${fixtures.map(f=>`<div class="person"><span><b>${esc(f.home_team)} v ${esc(f.away_team)}</b></span><span class="score"><input id="rh-${f.fixture_id}" type="number" min="0" max="20" value="${f.result_home_score??''}"><span>–</span><input id="ra-${f.fixture_id}" type="number" min="0" max="20" value="${f.result_away_score??''}"><button class="btn small" onclick="saveResult('${f.fixture_id}')">Save</button></span></div>`).join('')}</div><div class="card"><div class="section"><h2>Admin · Notice</h2><span>Post update</span></div><div class="field"><label>Title</label><input id="nt"></div><div class="field"><label>Message</label><textarea id="nb" rows="3"></textarea></div><button class="btn" onclick="postNotice()">Post notice</button></div>`}
function more(){const u=currentUserId(),p=prof(u),pending=invites.filter(i=>i.status==='pending'),pushOn=!!p.prediction_reminders,ios=/iPad|iPhone|iPod/.test(navigator.userAgent),standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;main.innerHTML=`<div class="card"><div class="section"><h2>Your profile</h2><span>${isAdmin()?'Admin':'Player'}</span></div><div class="field"><label>Name</label><input id="pn" value="${esc(p.display_name||'')}"></div><div class="field"><label>Team name</label><input id="pt" value="${esc(p.team_name||'')}"></div><div class="field"><label>Badge</label><select id="pb">${['⚽','🦁','🔥','⚡','👑','🐺','🦅','🎯','🏆'].map(x=>`<option ${x===p.badge?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Favourite club</label><input id="pc" value="${esc(p.favourite_club||'')}"></div><button class="btn good" onclick="saveProfile()">Save profile</button></div><div class="card"><div class="section"><h2>🔔 Prediction reminders</h2><span>48h · 24h · 2h</span></div><div class="toggleRow"><div><b>${pushOn?'Enabled':'Off'}</b><div class="notice">Only sent if you still have predictions missing.</div></div><div class="switch ${pushOn?'on':''}" onclick="${pushOn?'disableReminders()':'enableReminders()'}"><span></span></div></div>${pushOn?`<button class="btn secondary small" style="margin-top:10px" onclick="testPush()">Send test notification</button>`:''}${!supportsPush()?'<p class="footnote">This browser/device does not expose Web Push.</p>':''}${ios&&!standalone?'<p class="footnote"><b>iPhone/iPad:</b> add this site to your Home Screen first; Apple only allows web push for installed web apps.</p>':''}</div><div class="card"><div class="section"><h2>🔐 Sign-in</h2><span>Password</span></div><p class="notice">Set or change your password here. Your existing email sign-in link remains available as a fallback.</p><div class="field"><label>New password</label><input id="newPassword" type="password" minlength="8"></div><button class="btn secondary" onclick="setPassword()">Set / change password</button></div><div class="card"><div class="section"><h2>Invite a player</h2><span>Everyone can invite</span></div><p class="notice">Active players can invite friends until <b>${fmt(league.join_deadline)}</b>.</p><button class="btn" id="newInvite">Create WhatsApp invite</button>${pending.length?`<div class="sep"></div>${pending.slice(0,5).map(i=>`<div class="person"><span><b>${esc(i.code)}</b><div class="tiny">Pending</div></span><button class="btn secondary small" onclick="shareInvite('${esc(i.code)}')">Share</button></div>`).join('')}`:''}</div><div class="card"><div class="section"><h2>History</h2><span>Revealed picks & results</span></div><button class="btn secondary" onclick="showHistory()">View league history</button></div>${adminHtml()}<div class="card"><button class="btn danger" id="logout">Log out</button></div>`;document.getElementById('newInvite').onclick=createInvite;document.getElementById('logout').onclick=()=>sb.auth.signOut()}
setInterval(async()=>{if(session&&membership&&view==='chat'){await load();chatPage()}},15000);
setInterval(async()=>{if(session&&membership&&['home','table','ai'].includes(view)){await load();render()}},60000);
init();
</script>
