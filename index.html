t{error}=await sb.from('profiles').update(update).eq('user_id',u);if(error)return alert(error.message);await load();more()};window.saveResult=async f=>{const h=document.getElementById('rh-'+f),a=document.getElementById('ra-'+f);if(h.value===''||a.value==='')return alert('Enter both scores.');const{error}=await sb.rpc('admin_save_result',{p_fixture_id:f,p_home_score:+h.value,p_away_score:+a.value});if(error)return alert(error.message);await load();more()};function historyHtml(){const vis=fixtures.filter(f=>Date.now()>=new Date(f.prediction_lock_at));if(!vis.length)return `<p class="notice">Everyone's scores stay private until the prediction deadline.</p>`;return vis.map(f=>{const r=resultFor(f.id);return `<div class="fixture"><div class="section"><h2 style="font-size:14px">${esc(f.home_team)} v ${esc(f.away_team)}</h2><span>${r?`${r.home_score}–${r.away_score}`:'Locked'}</span></div>${members.map(m=>{const p=predFor(m.user_id,f.id);return `<div class="person"><span><b>${badge(m.user_id)} ${esc(team(m.user_id))}</b></span><span>${p?`${p.home_score}–${p.away_score}${r?` · +${points(p,r)}`:''}`:'No pick'}</span></div>`}).join('')}</div>`}).join('')}function adminHtml(){if(!isAdmin())return'';return `<div class="card"><div class="section"><h2>Admin · Results</h2><span>Manual for now</span></div>${fixtures.map(f=>{const r=resultFor(f.id);return `<div class="person"><span><b>${esc(f.home_team)} v ${esc(f.away_team)}</b></span><span class="score"><input id="rh-${f.id}" type="number" min="0" max="20" value="${r?.home_score??''}"><span>–</span><input id="ra-${f.id}" type="number" min="0" max="20" value="${r?.away_score??''}"><button class="btn small" onclick="saveResult('${f.id}')">Save</button></span></div>`}).join('')}</div><div class="card"><div class="section"><h2>Admin · Notice</h2><span>Post update</span></div><div class="field"><label>Title</label><input id="nt"></div><div class="field"><label>Message</label><textarea id="nb" rows="3"></textarea></div><button class="btn" onclick="postNotice()">Post notice</button></div>`}window.postNotice=async()=>{const t=document.getElementById('nt').value.trim(),b=document.getElementById('nb').value.trim();if(!t||!b)return;const{error}=await sb.from('notices').insert({league_id:league.id,title:t,body:b,kind:'info',priority:50,pinned:false,created_by:session.user.id});if(error)return alert(error.message);await load();more()};function more(){const u=session.user.id,p=prof(u),pending=invites.filter(i=>i.status==='pending');main.innerHTML=`<div class="card"><div class="section"><h2>Your profile</h2><span>${isAdmin()?'Admin':'Player'}</span></div><div class="field"><label>Name</label><input id="pn" value="${esc(p.display_name||'')}"></div><div class="field"><label>Team name</label><input id="pt" value="${esc(p.team_name||'')}"></div><div class="field"><label>Badge</label><select id="pb">${['⚽','🦁','🔥','⚡','👑','🐺','🦅','🎯','🏆'].map(x=>`<option ${x===p.badge?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Favourite club</label><input id="pc" value="${esc(p.favourite_club||'')}"></div><button class="btn good" onclick="saveProfile()">Save profile</button></div><div class="card"><div class="section"><h2>Invite a player</h2><span>Everyone can invite</span></div><p class="notice">Active players can invite friends until <b>${fmt(league.join_deadline)}</b>.</p><button class="btn" id="newInvite">Create WhatsApp invite</button>${pending.length?`<div class="sep"></div>${pending.slice(0,5).map(i=>`<div class="person"><span><b>${i.code}</b><div class="tiny">Pending</div></span><button class="btn secondary small" onclick="shareInvite('${i.code}')">Share</button></div>`).join('')}`:''}</div><div class="card"><div class="section"><h2>History</h2><span>Revealed picks</span></div>${historyHtml()}</div>${adminHtml()}<div class="card"><button class="btn danger" id="logout">Log out</button></div>`;document.getElementById('newInvite').onclick=createInvite;document.getElementById('logout').onclick=()=>sb.auth.signOut()}setInterval(async()=>{if(session&&membership&&view==='chat'){await load();chatPage()}},15000);init();</script></body></html>
